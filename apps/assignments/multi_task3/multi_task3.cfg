/*
 * multi_task3：3タスクのセマフォによる順次実行設定
 */
INCLUDE("tecsgen.cfg");

#include "multi_task3.h"

/* MAIN_TASKを最優先にし、2つのサブタスクは同じ優先度にする */
CRE_TSK(MAIN_TASK,    { TA_ACT, 0, Main,        MAIN_PRIORITY,     STACK_SIZE, NULL });
CRE_TSK(SUB_TASK1_A,  { TA_ACT, 0, sub_task1_A, MAIN_PRIORITY + 1, STACK_SIZE, NULL });
CRE_TSK(SUB_TASK2,    { TA_ACT, 0, sub_task2,   MAIN_PRIORITY + 1, STACK_SIZE, NULL });

/* 実行権を渡す順番：MAIN_TASK -> SUB_TASK1_A -> SUB_TASK2 -> MAIN_TASK */
CRE_SEM(SEM_MAIN,  { TA_NULL, 1, 1 });
CRE_SEM(SEM_SUB1_A,{ TA_NULL, 0, 1 });
CRE_SEM(SEM_SUB2,  { TA_NULL, 0, 1 });
