/*
 * cyc_task_multi.cfg
 *
 * 【元のcyc_task.cfgからの変更】
 * - MAIN_TASKに加えてCOUNT_TASKとMOVE_TASKを登録。
 * - LCDタスクを起こすSEM_COUNTを追加。
 * - 1秒周期の周期ハンドラは残し、通知先をCOUNT_TASKにする。
 */
INCLUDE("tecsgen.cfg");

#include "cyc_task_multi.h"

CRE_TSK(MAIN_TASK,  { TA_ACT, 0, Main,       MAIN_PRIORITY,     STACK_SIZE, NULL });
CRE_TSK(COUNT_TASK, { TA_ACT, 0, count_task, MAIN_PRIORITY,     STACK_SIZE, NULL });
CRE_TSK(MOVE_TASK,  { TA_ACT, 0, move_task,  MAIN_PRIORITY + 1, STACK_SIZE, NULL });

/* 周期ハンドラからCOUNT_TASKへ渡すセマフォ */
CRE_SEM(SEM_COUNT, { TA_NULL, 0, 1 });

/* 元サンプルと同じ1秒周期。Main()からsta_cyc()で開始する */
CRE_CYC(TEST_SPIKE_CYC1, {
    TA_NULL,
    { TNFY_HANDLER, 0, test_spike_cychdr },
    1000000,
    0
});
