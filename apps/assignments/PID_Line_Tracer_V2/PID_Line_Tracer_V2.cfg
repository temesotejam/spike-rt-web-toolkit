/*
 * PID_Line_Tracer_V2.cfg
 *
 * Main is a periodic control task. The cyclic handler only releases
 * SEM_CONTROL_TICK; sensor reads and motor commands run in Main.
 */
INCLUDE("tecsgen.cfg");

#include "PID_Line_Tracer_V2.h"

CRE_TSK(MAIN_TASK, {
    TA_ACT,
    0,
    Main,
    MAIN_PRIORITY,
    STACK_SIZE,
    NULL
});

CRE_SEM(SEM_CONTROL_TICK, {
    TA_NULL,
    0,
    1
});

CRE_CYC(CYC_CONTROL_TICK, {
    TA_NULL,
    { TNFY_HANDLER, 0, control_tick_handler },
    10000,
    10000
});
