/*
 * multi_task1_A：SUB_TASKを先に実行する設定
 */
INCLUDE("tecsgen.cfg");

#include "multi_task1_A.h"

/* 数値が小さいほど優先度が高い。SUB_TASKをMAIN_TASKより高くする */
CRE_TSK(MAIN_TASK, { TA_ACT, 0, Main, MAIN_PRIORITY + 1, STACK_SIZE, NULL });
CRE_TSK(SUB_TASK,  { TA_ACT, 0, sub_task, MAIN_PRIORITY, STACK_SIZE, NULL });

/* SUB_TASKはすぐに実行できる。MAIN_TASKはSUB_TASK完了まで待つ */
CRE_SEM(SEM_MAIN, { TA_NULL, 0, 1 });
CRE_SEM(SEM_SUB,  { TA_NULL, 1, 1 });
