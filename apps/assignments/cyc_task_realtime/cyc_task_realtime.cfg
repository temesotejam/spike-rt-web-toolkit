/*
 * cyc_task_realtime.cfg
 *
 * 【元のcyc_task.cfgからの変更】
 * 周期ハンドラではなく、Mainを高優先度のセンサー監視タスクにする。
 * SOUND_TASKは低い優先度で動かし、Mainのセンサー確認を優先する。
 */
INCLUDE("tecsgen.cfg");

#include "cyc_task_realtime.h"

CRE_TSK(MAIN_TASK, {
    TA_ACT,
    0,
    Main,
    2,        /* センサー監視を優先 */
    STACK_SIZE,
    NULL
});

/* Mainからact_tsk(SOUND_TASK)で起動する */
CRE_TSK(SOUND_TASK, {
    TA_NULL,
    0,
    sound_task,
    6,        /* 音楽タスクはセンサー監視より低い優先度 */
    STACK_SIZE,
    NULL
});
