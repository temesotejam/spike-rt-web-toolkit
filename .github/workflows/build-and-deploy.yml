name: Build all SPIKE-RT apps and deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "web/**"
      - ".github/workflows/build-and-deploy.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIKE_RT_REF: v0.2.0
  SPIKE_RT_IMAGE: spike-rt-builder:v0.2.0-slim
  APPS_ROOT: apps
  SPIKE_RT_APPS_DIR: user_apps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout SPIKE-RT read-only
        uses: actions/checkout@v6
        with:
          repository: spike-rt/spike-rt
          ref: ${{ env.SPIKE_RT_REF }}
          path: spike-rt
          submodules: true
          persist-credentials: false

      - name: Disable push to SPIKE-RT remote
        shell: bash
        run: |
          set -euxo pipefail
          git -C spike-rt remote set-url --push origin DISABLED
          git -C spike-rt remote -v

      - name: Validate and copy applications
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "spike-rt/${SPIKE_RT_APPS_DIR}"
          mkdir -p "spike-rt/${SPIKE_RT_APPS_DIR}"

          mapfile -t APPS < <(
            find "${APPS_ROOT}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
              LC_ALL=C sort
          )
          test "${#APPS[@]}" -gt 0

          : > spike-rt/app-list.txt
          for APP in "${APPS[@]}"; do
            [[ "${APP}" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]
            test -f "${APPS_ROOT}/${APP}/${APP}.c"
            test -f "${APPS_ROOT}/${APP}/project.json"
            python3 -m json.tool "${APPS_ROOT}/${APP}/project.json" >/dev/null

            TARGET_DIR="spike-rt/${SPIKE_RT_APPS_DIR}/${APP}"
            mkdir -p "${TARGET_DIR}"
            cp -a "${APPS_ROOT}/${APP}/." "${TARGET_DIR}/"

            if [[ ! -f "${TARGET_DIR}/${APP}.h" ]]; then
              HEADER_GUARD="$(printf '%s_H' "${APP}" |
                tr '[:lower:]' '[:upper:]' |
                tr -c 'A-Z0-9_' '_')"
              printf '%s\n' \
                "#ifndef ${HEADER_GUARD}" \
                "#define ${HEADER_GUARD}" \
                "#include <kernel.h>" \
                "#define MAIN_PRIORITY 5" \
                "#define MAIN_STACK_SIZE 4096" \
                "#define STACK_SIZE MAIN_STACK_SIZE" \
                "#ifndef TOPPERS_MACRO_ONLY" \
                "extern void main_task(intptr_t exinf);" \
                "#endif" \
                "#endif" \
                > "${TARGET_DIR}/${APP}.h"
            fi

            if [[ ! -f "${TARGET_DIR}/${APP}.cfg" ]]; then
              printf '%s\n' \
                'INCLUDE("tecsgen.cfg");' \
                "#include \"${APP}.h\"" \
                'CRE_TSK(APP_MAIN_TASK, { TA_ACT, 0, main_task, MAIN_PRIORITY, MAIN_STACK_SIZE, NULL });' \
                > "${TARGET_DIR}/${APP}.cfg"
            fi

            if [[ ! -f "${TARGET_DIR}/${APP}.cdl" ]]; then
              cp spike-rt/sample/motor/motor.cdl \
                "${TARGET_DIR}/${APP}.cdl"
            fi

            printf '%s\n' "${APP}" >> spike-rt/app-list.txt
          done

          echo "Applications:"
          cat spike-rt/app-list.txt

      - name: Patch pinned builder Dockerfile dependencies
        shell: bash
        run: |
          set -euxo pipefail
          DOCKERFILE="spike-rt/tools/docker/slim.dockerfile"
          sed -i \
            's/curl make libncurses5 python3 git/curl bzip2 make libncurses5 python3 git/' \
            "${DOCKERFILE}"
          grep -q "curl bzip2 make libncurses5 python3 git" "${DOCKERFILE}"

      - name: Build pinned SPIKE-RT builder image
        shell: bash
        run: |
          set -euxo pipefail
          docker build \
            --file spike-rt/tools/docker/slim.dockerfile \
            --tag "${SPIKE_RT_IMAGE}" \
            spike-rt/tools/docker

      - name: Build kernel and all applications
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e SPIKE_RT_APPS_DIR="${SPIKE_RT_APPS_DIR}" \
            -v "${GITHUB_WORKSPACE}/spike-rt:/work" \
            -w /work \
            "${SPIKE_RT_IMAGE}" \
            bash -c '
              set -euxo pipefail
              export PATH="/usr/local/gcc-arm-none-eabi/bin:${PATH}"
              command -v arm-none-eabi-gcc
              arm-none-eabi-gcc --version
              command -v arm-none-eabi-size
              git config --global --add safe.directory "*"

              mkdir -p build/obj-primehub_kernel
              cd build/obj-primehub_kernel
              ../../asp3/configure.rb -T primehub_gcc -f -m ../../common/kernel.mk
              make -j2 libkernel.a
              cd ../..
              mkdir -p build/app-logs

              while IFS= read -r APP; do
                test -n "${APP}"
                (
                  set -euxo pipefail
                  BUILD_DIR="build/obj-primehub_${APP}"
                  rm -rf "${BUILD_DIR}"
                  mkdir -p "${BUILD_DIR}"
                  cd "${BUILD_DIR}"
                  ../../asp3/configure.rb \
                    -T primehub_gcc \
                    -L ../obj-primehub_kernel \
                    -a "../../${SPIKE_RT_APPS_DIR}/${APP}/" \
                    -A "${APP}" \
                    -m ../../common/app.mk
                  rm -f asp asp.bin asp.bin.sha256 size.txt
                  make -j2
                  test -s asp.bin
                  sha256sum asp.bin > asp.bin.sha256
                  arm-none-eabi-size asp > size.txt
                ) 2>&1 | tee "build/app-logs/${APP}.log"
              done < app-list.txt
            ' 2>&1 | tee build.log

      - name: Upload diagnostic build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-rt-diagnostic-logs-${{ github.run_number }}
          path: |
            build.log
            spike-rt/build/app-logs/*.log
          if-no-files-found: warn
          retention-days: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site/firmware
          cp -a web/. site/
          cp build.log site/firmware/build.log
          export BUILT_AT
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          apps_root = Path(os.environ["APPS_ROOT"])
          build_root = Path("spike-rt/build")
          site_root = Path("site/firmware")
          app_ids = [
              line.strip()
              for line in Path("spike-rt/app-list.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          catalog_apps = []
          for app_id in app_ids:
              metadata_path = apps_root / app_id / "project.json"
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if metadata.get("id") != app_id:
                  raise SystemExit(f"{metadata_path}: id must be {app_id!r}")

              build_dir = build_root / f"obj-primehub_{app_id}"
              firmware_path = build_dir / "asp.bin"
              if not firmware_path.is_file() or firmware_path.stat().st_size == 0:
                  raise SystemExit(f"Missing firmware: {firmware_path}")

              output_dir = site_root / app_id
              output_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy2(firmware_path, output_dir / "asp.bin")
              shutil.copy2(build_dir / "asp.bin.sha256", output_dir / "asp.bin.sha256")
              shutil.copy2(build_dir / "size.txt", output_dir / "size.txt")
              shutil.copy2(build_root / "app-logs" / f"{app_id}.log", output_dir / "build.log")

              firmware_bytes = firmware_path.read_bytes()
              sha256 = hashlib.sha256(firmware_bytes).hexdigest()
              size = len(firmware_bytes)
              manifest = {
                  "appId": app_id,
                  "appName": metadata.get("name", app_id),
                  "description": metadata.get("description", ""),
                  "warning": metadata.get("warning", ""),
                  "origin": metadata.get("origin", ""),
                  "file": "asp.bin",
                  "loadAddress": "0x08008000",
                  "maxBytes": 992 * 1024,
                  "size": size,
                  "sha256": sha256,
                  "sourceCommit": os.environ["GITHUB_SHA"],
                  "sourcePath": f"apps/{app_id}",
                  "spikeRtCommit": os.environ["SPIKE_RT_REF"],
                  "runNumber": os.environ["GITHUB_RUN_NUMBER"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "builtAt": os.environ["BUILT_AT"],
                  "repository": os.environ["GITHUB_REPOSITORY"],
              }
              (output_dir / "manifest.json").write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              catalog_apps.append({
                  "id": app_id,
                  "name": manifest["appName"],
                  "description": manifest["description"],
                  "warning": manifest["warning"],
                  "origin": manifest["origin"],
                  "size": size,
                  "sha256": sha256,
                  "manifest": f"{app_id}/manifest.json",
              })

          catalog = {
              "defaultApp": "myapp" if "myapp" in app_ids else app_ids[0],
              "count": len(catalog_apps),
              "sourceCommit": os.environ["GITHUB_SHA"],
              "spikeRtCommit": os.environ["SPIKE_RT_REF"],
              "builtAt": os.environ["BUILT_AT"],
              "apps": catalog_apps,
          }
          (site_root / "catalog.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload all firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spike-rt-firmware-all-${{ github.run_number }}
          path: site/firmware
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
