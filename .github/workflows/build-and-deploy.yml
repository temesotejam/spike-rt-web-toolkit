name: Build changed SPIKE-RT apps and deploy Pages

on:
  push:
    branches:
      - main
      - feature/build-pd-practice-zip
    paths:
      - "apps/**"
      - "web/**"
      - ".github/workflows/build-and-deploy.yml"
      - ".github/scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIKE_RT_REF: v0.2.0
  SPIKE_RT_IMAGE: spike-rt-builder:v0.2.0-slim
  APPS_ROOT: apps
  SPIKE_RT_APPS_DIR: user_apps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout SPIKE-RT read-only
        uses: actions/checkout@v6
        with:
          repository: spike-rt/spike-rt
          ref: ${{ env.SPIKE_RT_REF }}
          path: spike-rt
          submodules: true
          persist-credentials: false

      - name: Disable push to SPIKE-RT remote
        shell: bash
        run: |
          set -euxo pipefail
          git -C spike-rt remote set-url --push origin DISABLED
          git -C spike-rt remote -v

      - name: Import zipped applications
        shell: bash
        run: python3 .github/scripts/import-zipped-apps.py

      - name: Verify assignment copies
        run: python3 .github/scripts/test-create-assignment.py

      - name: Validate and copy applications
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "spike-rt/${SPIKE_RT_APPS_DIR}"
          mkdir -p "spike-rt/${SPIKE_RT_APPS_DIR}"

          # apps/直下のアプリと apps/assignments/内の課題を同列にビルド
          mapfile -t APP_DIRS < <(
            find "${APPS_ROOT}" -mindepth 1 -maxdepth 1 -type d ! -name assignments -print
            if [[ -d "${APPS_ROOT}/assignments" ]]; then
              find "${APPS_ROOT}/assignments" -mindepth 1 -maxdepth 1 -type d -print
            fi
          )
          test "${#APP_DIRS[@]}" -gt 0
          : > spike-rt/app-list.txt
          : > spike-rt/app-sources.tsv
          declare -A SEEN_APPS=()
          for APP_DIR in "${APP_DIRS[@]}"; do
            APP="${APP_DIR##*/}"
            [[ "${APP}" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]
            test -f "${APP_DIR}/${APP}.c"
            if [[ -n "${SEEN_APPS[${APP}]:-}" ]]; then
              echo "Duplicate application ID: ${APP}" >&2
              exit 1
            fi
            SEEN_APPS["${APP}"]=1
            if [[ -f "${APP_DIR}/project.json" ]]; then
              python3 -m json.tool "${APP_DIR}/project.json" >/dev/null
            fi
            TARGET_DIR="spike-rt/${SPIKE_RT_APPS_DIR}/${APP}"
            mkdir -p "${TARGET_DIR}"
            cp -a "${APP_DIR}/." "${TARGET_DIR}/"
            # h/cfg/cdlはアプリ側で上書き可能。無ければ標準構成を生成する。
            if [[ ! -f "${TARGET_DIR}/${APP}.h" ]]; then
              HEADER_GUARD="$(printf '%s_H' "${APP}" |
                tr '[:lower:]' '[:upper:]' |
                tr -c 'A-Z0-9_' '_')"
              printf '%s\n' \
                "#ifndef ${HEADER_GUARD}" \
                "#define ${HEADER_GUARD}" \
                "#include <kernel.h>" \
                "#define MAIN_PRIORITY 5" \
                "#define MAIN_STACK_SIZE 4096" \
                "#define STACK_SIZE MAIN_STACK_SIZE" \
                "#ifndef TOPPERS_MACRO_ONLY" \
                "extern void main_task(intptr_t exinf);" \
                "#endif" \
                "#endif" \
                > "${TARGET_DIR}/${APP}.h"
            fi

            if [[ ! -f "${TARGET_DIR}/${APP}.cfg" ]]; then
              printf '%s\n' \
                'INCLUDE("tecsgen.cfg");' \
                "#include \"${APP}.h\"" \
                'CRE_TSK(APP_MAIN_TASK, { TA_ACT, 0, main_task, MAIN_PRIORITY, MAIN_STACK_SIZE, NULL });' \
                > "${TARGET_DIR}/${APP}.cfg"
            fi

            if [[ ! -f "${TARGET_DIR}/${APP}.cdl" ]]; then
              cp spike-rt/sample/motor/motor.cdl \
                "${TARGET_DIR}/${APP}.cdl"
            fi

            printf '%s\n' "${APP}" >> spike-rt/app-list.txt
            printf '%s\t%s\n' "${APP}" "${APP_DIR}" >> spike-rt/app-sources.tsv
          done

          echo "Applications:"
          cat spike-rt/app-list.txt

      # A bundle from a previous successful run retains unchanged binaries.
      # If unavailable, the incremental planner rebuilds all missing entries.
      - name: Restore previously built firmware
        id: firmware-restore
        uses: actions/cache/restore@v4
        with:
          path: firmware-cache
          key: firmware-bundle-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            firmware-bundle-v1-${{ runner.os }}-

      - name: Detect changed applications
        id: incremental
        shell: bash
        run: python3 .github/scripts/incremental-firmware.py plan

      - name: Patch pinned builder Dockerfile dependencies
        if: steps.incremental.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          DOCKERFILE="spike-rt/tools/docker/slim.dockerfile"

          # Install/update trusted CA roots before HTTPS toolchain downloads.
          sed -i \
            's/curl make libncurses5 python3 git/curl ca-certificates bzip2 make libncurses5 python3 git/' \
            "${DOCKERFILE}"
          # Repair retired Bullseye apt mirrors inside the Docker build.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("spike-rt/tools/docker/slim.dockerfile")
          s = path.read_text()
          original = "RUN apt update"
          assert original in s
          pre = ("RUN sed -i -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' "
                 "-e 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list "
                 "&& rm -rf /var/lib/apt/lists/* "
                 "&& apt-get update -o Acquire::Check-Valid-Until=false")
          path.write_text(s.replace(original, pre, 1))
          PY

          grep -q "curl ca-certificates bzip2 make libncurses5 python3 git" "${DOCKERFILE}"
          grep -n "apt install" -A4 "${DOCKERFILE}"

      - name: Set up Docker Buildx
        if: steps.incremental.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v3

      # Docker toolchain layers also survive runs, not only app firmware.
      - name: Build pinned SPIKE-RT builder image
        if: steps.incremental.outputs.needs_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: spike-rt/tools/docker
          file: spike-rt/tools/docker/slim.dockerfile
          load: true
          tags: ${{ env.SPIKE_RT_IMAGE }}
          cache-from: type=gha,scope=spike-rt-v0.2.0-builder
          cache-to: type=gha,mode=max,scope=spike-rt-v0.2.0-builder

      - name: Build kernel and changed applications
        if: steps.incremental.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            -e SPIKE_RT_APPS_DIR="${SPIKE_RT_APPS_DIR}" \
            -v "${GITHUB_WORKSPACE}/spike-rt:/work" \
            -w /work \
            "${SPIKE_RT_IMAGE}" \
            bash -c '
              set -euxo pipefail

              export PATH="/usr/local/gcc-arm-none-eabi/bin:${PATH}"
              command -v arm-none-eabi-gcc
              arm-none-eabi-gcc --version
              command -v arm-none-eabi-size
              git config --global --add safe.directory "*"

              echo "=== Configure kernel ==="
              mkdir -p build/obj-primehub_kernel
              cd build/obj-primehub_kernel
              ../../asp3/configure.rb \
                -T primehub_gcc \
                -f \
                -m ../../common/kernel.mk

              echo "=== Build kernel ==="
              make -j2 libkernel.a
              cd ../..

              mkdir -p build/app-logs

              failed_apps=()
              while IFS= read -r APP; do
                test -n "${APP}"
                echo "=== Build application: ${APP} ==="

                if (
                  set -euxo pipefail
                  BUILD_DIR="build/obj-primehub_${APP}"
                  rm -rf "${BUILD_DIR}"
                  mkdir -p "${BUILD_DIR}"
                  cd "${BUILD_DIR}"

                  ../../asp3/configure.rb \
                    -T primehub_gcc \
                    -L ../obj-primehub_kernel \
                    -a "../../${SPIKE_RT_APPS_DIR}/${APP}/" \
                    -A "${APP}" \
                    -m ../../common/app.mk

                  rm -f asp asp.bin asp.bin.sha256 size.txt
                  make -j2

                  test -s asp.bin
                  sha256sum asp.bin > asp.bin.sha256
                  arm-none-eabi-size asp > size.txt
                ) 2>&1 | tee "build/app-logs/${APP}.log"; then
                  echo "BUILD OK: ${APP}"
                else
                  failed_apps+=("${APP}")
                  echo "BUILD FAILED: ${APP}"
                fi
              done < app-to-build.txt
              printf "FAILED APPS: %s\\n" "${failed_apps[*]:-none}"
              test "${#failed_apps[@]}" -eq 0
            ' 2>&1 | tee build.log

      - name: Verify all firmware and update reuse bundle
        shell: bash
        run: python3 .github/scripts/incremental-firmware.py finalize

      - name: Save firmware reuse bundle
        if: steps.firmware-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: firmware-cache
          key: firmware-bundle-v1-${{ runner.os }}-${{ github.sha }}

      - name: Upload diagnostic build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-rt-diagnostic-logs-${{ github.run_number }}
          path: |
            build.log
            spike-rt/build/app-logs/*.log
          if-no-files-found: warn
          retention-days: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf site
          mkdir -p site/firmware
          cp -a web/. site/
          cp build.log site/firmware/build.log

          export BUILT_AT
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          apps_root = Path(os.environ["APPS_ROOT"])
          build_root = Path("firmware-cache")
          site_root = Path("site/firmware")
          app_ids = [
              line.strip()
              for line in Path("spike-rt/app-list.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          app_sources = dict(
              line.split("\t", 1)
              for line in Path("spike-rt/app-sources.tsv").read_text(encoding="utf-8").splitlines()
              if line.strip()
          )
          catalog_apps = []
          for app_id in app_ids:
              source_dir = Path(app_sources[app_id])
              metadata_path = source_dir / "project.json"
              metadata = {}
              if metadata_path.is_file():
                  metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
                  configured_id = metadata.get("id", app_id)
                  if configured_id != app_id:
                      raise SystemExit(f"{metadata_path}: id must be {app_id!r}")

              build_dir = build_root / app_id
              firmware_path = build_dir / "asp.bin"
              if not firmware_path.is_file() or firmware_path.stat().st_size == 0:
                  raise SystemExit(f"Missing firmware: {firmware_path}")

              output_dir = site_root / app_id
              output_dir.mkdir(parents=True, exist_ok=True)

              shutil.copy2(firmware_path, output_dir / "asp.bin")
              shutil.copy2(build_dir / "asp.bin.sha256", output_dir / "asp.bin.sha256")
              shutil.copy2(build_dir / "size.txt", output_dir / "size.txt")
              shutil.copy2(build_dir / "build.log", output_dir / "build.log")

              firmware_bytes = firmware_path.read_bytes()
              sha256 = hashlib.sha256(firmware_bytes).hexdigest()
              size = len(firmware_bytes)

              manifest = {
                  "appId": app_id,
                  "appName": metadata.get("name", app_id),
                  "description": metadata.get("description", ""),
                  "warning": metadata.get("warning", ""),
                  "origin": metadata.get("origin", ""),
                  "file": "asp.bin",
                  "loadAddress": "0x08008000",
                  "maxBytes": 992 * 1024,
                  "size": size,
                  "sha256": sha256,
                  "sourceCommit": (build_dir / "built_commit.txt").read_text(encoding="utf-8").strip(),
                  "sourcePath": source_dir.as_posix(),
                  "category": "assignment" if source_dir.parent == apps_root / "assignments" else "sample",
                  "spikeRtCommit": os.environ["SPIKE_RT_REF"],
                  "runNumber": os.environ["GITHUB_RUN_NUMBER"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "builtAt": os.environ["BUILT_AT"],
                  "repository": os.environ["GITHUB_REPOSITORY"],
              }

              (output_dir / "manifest.json").write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              catalog_apps.append(
                  {
                      "id": app_id,
                      "name": manifest["appName"],
                      "description": manifest["description"],
                      "warning": manifest["warning"],
                      "origin": manifest["origin"],
                      "category": manifest["category"],
                      "size": size,
                      "sha256": sha256,
                      "manifest": f"{app_id}/manifest.json",
                  }
              )

          catalog = {
              "defaultApp": "myapp" if "myapp" in app_ids else app_ids[0],
              "count": len(catalog_apps),
              "sourceCommit": os.environ["GITHUB_SHA"],
              "spikeRtCommit": os.environ["SPIKE_RT_REF"],
              "builtAt": os.environ["BUILT_AT"],
              "apps": catalog_apps,
          }
          (site_root / "catalog.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload all firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spike-rt-firmware-all-${{ github.run_number }}
          path: site/firmware
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
